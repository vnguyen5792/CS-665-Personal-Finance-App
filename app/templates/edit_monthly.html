{% extends "base.html" %}
{% block title %}Edit Monthly Budget | FinanceApp{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm">
            <h2 class="h5 mb-4">Edit Budget: {{ mt.month }}/{{ mt.year }}</h2>
            
            <form method="POST" action="{{ url_for('main.edit_monthly', year=mt.year, month=mt.month) }}">
                
                <div class="mb-4">
                    <label class="form-label">Target Goal Amount ($)</label>
                    <input type="number" name="month_goal" step="0.01" min="0" class="form-control" required value="{{ '%.2f'|format(mt.month_goal) }}">
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('main.index') }}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary">Update Goal</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
