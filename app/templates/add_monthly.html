{% extends "base.html" %}
{% block title %}Add Monthly Budget | FinanceApp{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm">
            <h2 class="h5 mb-4">Create Monthly Budget</h2>
            
            <form method="POST" action="{{ url_for('main.add_monthly') }}">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Month</label>
                        <select name="month" class="form-select" required>
                            <option value="">Select...</option>
                            <option value="1">January</option>
                            <option value="2">February</option>
                            <option value="3">March</option>
                            <option value="4">April</option>
                            <option value="5">May</option>
                            <option value="6">June</option>
                            <option value="7">July</option>
                            <option value="8">August</option>
                            <option value="9">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Year</label>
                        <input type="number" name="year" class="form-control" required value="2026" min="2000" max="2100">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Target Goal Amount ($)</label>
                    <input type="number" name="month_goal" step="0.01" min="0" class="form-control" required placeholder="e.g., 3000.00">
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('main.index') }}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Budget</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
